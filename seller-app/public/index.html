<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seller Platform — P2P Trading Demo</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121822; --panel2: #182233; --border: #263349;
    --text: #e8edf5; --muted: #8fa1bd; --accent: #2fe0c6; --amber: #f5b942; --red: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 0.02em; }
  header .role { color: var(--accent); font-weight: 600; }
  header .earnings { text-align: right; }
  header .earnings .amt { font-size: 22px; font-weight: 700; color: var(--accent); }
  header .earnings .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 14px; }
  form.publish { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--muted); }
  .field input { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px 10px; width: 140px; font-size: 14px; }
  button { background: var(--accent); color: #05201c; border: none; border-radius: 6px; padding: 9px 16px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button:hover { filter: brightness(1.08); }
  button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  button.amber { background: var(--amber); color: #2a1b02; }
  button:disabled { opacity: 0.4; cursor: default; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .row .meta { display: flex; flex-direction: column; gap: 2px; }
  .row .meta .primary { font-weight: 600; }
  .row .meta .secondary { font-size: 12px; color: var(--muted); }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .badge.pending { background: rgba(245,185,66,0.15); color: var(--amber); }
  .badge.awaiting { background: rgba(143,161,189,0.15); color: var(--muted); }
  .badge.active { background: rgba(47,224,198,0.15); color: var(--accent); }
  .badge.settled { background: rgba(47,224,198,0.25); color: var(--accent); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--accent); color: var(--text); padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .conn { font-size: 11px; color: var(--muted); }
  .conn.up::before { content: "● "; color: var(--accent); }
  .conn.down::before { content: "● "; color: var(--red); }
</style>
</head>
<body>
<header>
  <h1>⚡ <span class="role">Seller Platform</span> — sellerapp.example.com</h1>
  <div class="earnings">
    <div class="amt" id="earnings">₹0.00</div>
    <div class="lbl">Earnings (settled)</div>
  </div>
</header>
<main>
  <div class="panel">
    <h2>Publish a new offer <span class="conn down" id="conn" style="float:right">connecting…</span></h2>
    <form class="publish" id="publishForm">
      <div class="field"><label>Quantity (kWh)</label><input type="number" step="0.1" name="quantityKwh" value="20" required></div>
      <div class="field"><label>Price (₹/kWh)</label><input type="number" step="0.1" name="pricePerKwh" value="12.5" required></div>
      <button type="submit">Publish offer</button>
    </form>
  </div>

  <div class="panel">
    <h2>Incoming requests</h2>
    <div class="list" id="requests"><div class="empty">No incoming requests yet.</div></div>
  </div>

  <div class="panel">
    <h2>Active &amp; settled trades</h2>
    <div class="list" id="trades"><div class="empty">No trades yet.</div></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function badge(status) {
  const map = { PENDING_ACCEPT: ["pending", "Pending"], AWAITING_CONFIRM: ["awaiting", "Awaiting confirm"], ACTIVE: ["active", "Active"], SETTLED: ["settled", "Settled"] };
  const [cls, label] = map[status] || ["awaiting", status];
  return `<span class="badge ${cls}">${label}</span>`;
}

async function refreshAll() {
  const [trades, earnings] = await Promise.all([
    fetch("/api/trades").then((r) => r.json()),
    fetch("/api/earnings").then((r) => r.json()),
  ]);
  renderRequests(trades.filter((t) => t.status === "PENDING_ACCEPT"));
  renderTrades(trades.filter((t) => t.status !== "PENDING_ACCEPT"));
  $("#earnings").textContent = "₹" + Number(earnings.total).toFixed(2);
}

function renderRequests(list) {
  const el = $("#requests");
  if (!list.length) { el.innerHTML = '<div class="empty">No incoming requests yet.</div>'; return; }
  el.innerHTML = list.map((t) => `
    <div class="row" data-txn="${t.transactionId}">
      <div class="meta">
        <div class="primary">${t.requestedQty} kWh @ ₹${t.pricePerKwh}/kWh</div>
        <div class="secondary">from ${t.bapId} · discom: ${t.buyerDiscom}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        ${badge(t.status)}
        <button onclick="accept('${t.transactionId}')">Accept</button>
      </div>
    </div>`).join("");
}

function renderTrades(list) {
  const el = $("#trades");
  if (!list.length) { el.innerHTML = '<div class="empty">No trades yet.</div>'; return; }
  el.innerHTML = list.map((t) => `
    <div class="row" data-txn="${t.transactionId}">
      <div class="meta">
        <div class="primary">${t.requestedQty} kWh @ ₹${t.pricePerKwh}/kWh${t.finalAlloc ? ` — delivered ${t.finalAlloc} kWh` : ""}</div>
        <div class="secondary">from ${t.bapId} · discom: ${t.buyerDiscom}${t.settlementAmount ? ` · settled ₹${t.settlementAmount.toFixed(2)}` : ""}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        ${badge(t.status)}
        ${t.status === "ACTIVE" ? `<button class="amber" onclick="deliver('${t.transactionId}')">Mark as delivered</button>` : ""}
      </div>
    </div>`).join("");
}

async function accept(txn) {
  const res = await fetch(`/api/accept/${txn}`, { method: "POST" });
  const body = await res.json();
  if (!res.ok) { toast("Accept failed: " + (body.error || res.status)); return; }
  toast("on_init sent — waiting for buyer to confirm");
}

async function deliver(txn) {
  const res = await fetch(`/api/deliver/${txn}`, { method: "POST" });
  const body = await res.json();
  if (!res.ok) { toast("Deliver failed: " + (body.error || res.status)); return; }
  toast(`Settled ₹${body.trade.settlementAmount.toFixed(2)} (delivered ${body.trade.finalAlloc} kWh)`);
}

$("#publishForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = { quantityKwh: Number(fd.get("quantityKwh")), pricePerKwh: Number(fd.get("pricePerKwh")) };
  const res = await fetch("/api/publish", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const result = await res.json();
  if (!res.ok) { toast("Publish failed: " + (result.error || res.status)); return; }
  toast(`Published ${body.quantityKwh} kWh @ ₹${body.pricePerKwh}/kWh`);
});

function connectWs() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $("#conn").textContent = "live"; $("#conn").className = "conn up"; };
  ws.onclose = () => { $("#conn").textContent = "disconnected"; $("#conn").className = "conn down"; setTimeout(connectWs, 2000); };
  ws.onmessage = (ev) => {
    const { type, data } = JSON.parse(ev.data);
    if (type === "incoming_request") toast(`New request: ${data.requestedQty} kWh from ${data.bapId}`);
    if (type === "accepted") toast("Accepted — on_init sent");
    if (type === "active") toast("Trade confirmed — now ACTIVE");
    if (type === "settled") toast(`Settled ₹${data.settlementAmount.toFixed(2)}`);
    refreshAll();
  };
}

connectWs();
refreshAll();
setInterval(refreshAll, 5000);
</script>
</body>
</html>
